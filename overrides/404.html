{% extends "home.html" %}
{% block title %}Page not found — {{ config.site_name | e }}{% endblock %}
{% block main_content %}
<section class="faq" aria-labelledby="not-found-heading">
  <p class="eyebrow">404 · Page not found</p>
  <h1 id="not-found-heading">This page isn’t here.</h1>
  <p>The link may have changed, or the page may no longer be available.</p>
  <a class="call-button" href="{{ '/' | url }}">Back to home <span aria-hidden="true">↗</span></a>
</section>
{% endblock %}
