site_name: Virtus Optio
site_description: Ethical selling and practical sales systems to help businesses win more customers and build stronger client relationships.

watch:
  - overrides

nav:
  - Home:
    - About: index.md
  - Blog:
    - blog/index.md 

exclude_docs: |
  portfolio/

theme:
  name: material
  custom_dir: overrides
  features:
    - search.suggest
    - toc.integrate
    - navigation.tabs
    - navigation.expand
    - navigation.sections
    - content.tooltips
    - content.tabs.link
    - content.code.copy
    - navigation.footer
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: custom
      accent: custom  
    - scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: custom
      accent: custom
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/slash-forward-box
  favicon: assets/favicon.png

extra:
  generator: false

extra_css:
  - stylesheets/extra.css
  - stylesheets/hero.css
plugins:
  - search
  - blog:
      blog_dir: blog
      authors: false
      categories: true
      categories_allowed:
        - Business

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - def_list
  - pymdownx.keys

copyright: Copyright &copy; 2026 Virtus Optio
