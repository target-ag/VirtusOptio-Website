<header class="site-header">
  <a class="wordmark" href="{{ '.' | url }}" aria-label="Virtus Optio home">{% include "partials/brand-logo.html" %}</a>
  <div class="header-actions">
    <div class="header-menu" id="site-menu">
    <nav class="site-navigation" aria-label="Main navigation">
      <a href="mailto:{{ config.extra.contact_email | e }}" data-email-contact>Contact</a>
      <a href="{{ 'blog/' | url }}">Blog</a>
    </nav>
    <a class="site-contact" href="{{ 'about/' | url }}">About Me {% include "partials/arrow-up-right.html" %}</a>
    </div>
    <!--LANGUAGE_SWITCH-->
    {% include "partials/theme-toggle.html" %}
    <button class="mobile-menu-toggle" type="button" data-menu-toggle aria-label="Open menu" aria-expanded="false" aria-controls="site-menu" hidden>
      <svg class="menu-icon-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      <svg class="menu-icon-close" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </div>
</header>
