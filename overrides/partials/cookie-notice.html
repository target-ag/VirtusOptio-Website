<section class="cookie-notice" id="cookie-notice" aria-labelledby="cookie-notice-title" hidden>
  <div class="cookie-notice-copy">
    <h2 id="cookie-notice-title" tabindex="-1">Cookies &amp; privacy</h2>
    <p>This site uses functional storage for your theme and this notice. No advertising or analytics cookies.</p>
  </div>
  <div class="cookie-notice-actions">
    <a href="{{ 'cookies/' | url }}">Cookie Policy</a>
    <a href="{{ 'cookie-settings/' | url }}" data-cookie-open>Cookie Settings</a>
    <button type="button" data-cookie-acknowledge>Got it</button>
  </div>
</section>
